# SERVER ------------------------------
server:
  port: ${PORT:8080}
  address: 0.0.0.0
# DOCUMENTATION ----------------------------
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
# SPRING ---------------------------------
spring:
  application:
    name: marketplace
  cache:
    type: redis
    redis:
      time-to-live: 300000 # 5 minutes (in ms)
  redis:
    url: ${REDIS_URI}
  data:
    mongodb:
      uri: ${DATABASE_URI}
      auto-index-creation: true

# CUSTOM ------------------------
aws:
  endpoint: ${AWS_ENDPOINT}
  region: ${AWS_REGION}
  accessKey: ${AWS_ACCESS_KEY_ID}
  secretKey: ${AWS_SECRET_KEY}
  s3:
    bucket: ${AWS_S3_IMAGE_BUCKET}
  redis:
    host: localhost
    port: 6379